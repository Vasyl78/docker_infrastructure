version: "3.8"

services:
  apm-server:
    image: docker.elastic.co/beats/elastic-agent:${STACK_VERSION}
    networks:
      - infrastructure
    environment:
      - FLEET_ENROLL=1
      - FLEET_TOKEN_POLICY_NAME='Agent Policy APM Server'
      - FLEET_INSECURE=true
      - FLEET_URL=http://fleet-server:8220
      # Enrollment.
      # (a) Auto-enroll using basic authentication
      # - ELASTICSEARCH_USERNAME=elastic
      # - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-}
      # (b) Enroll using a pre-generated enrollment token
      - FLEET_ENROLLMENT_TOKEN=${FLEET_ENROLLMENT_TOKEN}
    ports:
      - 8200:8200
    hostname: apm-server
    # Elastic Agent does not retry failed connections to Kibana upon the initial enrollment phase.
    restart: on-failure
    depends_on: []
      # es01:
      #   condition: service_healthy
      # kibana:
      #   condition: service_healthy
      # fleet-server:
      #   condition: service_healthy

networks:
  infrastructure:
    name: infra
    external: true
