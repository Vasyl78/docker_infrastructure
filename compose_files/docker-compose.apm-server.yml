version: "3.8"

services:
  apm-server:
    image: docker.elastic.co/beats/elastic-agent:${STACK_VERSION}
    volumes:
      - ./../volumes/apm_server/config/elastic-agent.yml:/usr/share/elastic-agent/elastic-agent.yml
    networks:
      - infrastructure
    environment:
      - FLEET_ENROLL=1
      - FLEET_TOKEN_POLICY_NAME='Agent Policy APM Server'
      - FLEET_URL=https://fleet-server:8220
      # Enrollment.
      # (a) Auto-enroll using basic authentication
      # - ELASTICSEARCH_USERNAME=elastic
      # - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-}
      # (b) Enroll using a pre-generated enrollment token
      - FLEET_ENROLLMENT_TOKEN=${FLEET_ENROLLMENT_TOKEN}
      - FLEET_INSECURE=true
      - FLEET_SERVER_INSECURE_HTTP=true

      - FLEET_SERVER_ELASTICSEARCH_INSECURE=true
      - AGENT_LOGGING_LEVEL=warning
      - ELASTIC_AGENT_TAGS=apm-server,internal,apm
    ports:
      - 8200:8200
    hostname: apm-server
    # user: root
    # Elastic Agent does not retry failed connections to Kibana upon the initial enrollment phase.
    restart: on-failure
    depends_on: []
      # es01:
      #   condition: service_healthy
      # kibana:
      #   condition: service_healthy
      # fleet-server:
      #   condition: service_healthy

networks:
  infrastructure:
    name: infra
    external: true
